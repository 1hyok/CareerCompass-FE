name: 이슈 등록
description: 작업 유형과 주 담당 모듈을 지정해 이슈를 등록합니다.
title: ""
body:
  - type: dropdown
    id: work-type
    attributes:
      label: 작업 유형
      description: 이슈의 주된 변경 성격을 하나 선택해 주세요.
      options:
        - bug — 버그·오동작
        - enhancement — 신규 기능·기존 기능 개선
        - documentation — 문서
        - maintenance — CI·빌드·의존성·저장소 운영 유지보수
        - refactor — 동작 변경 없는 구조·책임·경계 개선
        - release — 배포·릴리스 파이프라인 및 산출물
        - security — 보안 취약점·권한·자격·공급망 대응
        - test — 테스트·검증·회귀 방지
    validations:
      required: true

  - type: dropdown
    id: primary-module
    attributes:
      label: 주 담당 모듈
      description: 여러 영역이 겹치면 주된 원인과 실제 수정 파일을 기준으로 하나를 선택해 주세요.
      options:
        - careercompass — 앱 셸·내비게이션
        - core — 코어(디자인 시스템·네트워크·인증)
        - onboarding — 스플래시·로그인·온보딩
        - feed — 공고 피드·필터·공고 상세
        - editor — AI 자소서 초안·에디터·저장/이력
        - profile — 마이·프로필 편집·경험 카드·과거 자소서
        - foryou — For You·커리어 로드맵·강점 Export
        - notification — 알림·알림 설정
        - platform — Android 앱·CI·빌드·릴리스·저장소 운영
    validations:
      required: true

  - type: textarea
    id: overview
    attributes:
      label: 개요
      description: 문제, 필요한 변경, 완료 조건을 구체적으로 적어 주세요.
    validations:
      required: true

  - type: textarea
    id: child-issues
    attributes:
      label: 자식 이슈
      description: 연결할 자식 이슈가 있으면 번호를 적어 주세요.
      placeholder: "- #123"
    validations:
      required: false

  - type: textarea
    id: note
    attributes:
      label: 참고
      description: 추가 제약이나 참고 자료가 있으면 적어 주세요.
    validations:
      required: false
